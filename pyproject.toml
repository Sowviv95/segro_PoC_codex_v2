[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segro-evidence-extraction"
version = "0.1.0"
description = "Evidence-first foundation for SEGRO asset data extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "PyMuPDF>=1.24,<2",
    "psutil>=5.9,<8",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
segro-evidence-extraction = "segro_evidence_extraction.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/segro_evidence_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
cache_dir = ".pytest_cache"

[tool.coverage.run]
branch = true
source = ["segro_evidence_extraction"]

[tool.ruff]
line-length = 100
cache-dir = ".ruff_cache"
src = ["src", "tests"]
extend-exclude = [
    ".cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".pytest_run_tmp",
    "pytest-cache-files-*",
    "data",
    "output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["segro_evidence_extraction"]
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psutil", "psutil.*"]
ignore_missing_imports = true
